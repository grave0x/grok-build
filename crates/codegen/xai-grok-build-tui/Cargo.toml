[package]
name = "xai-grok-build-tui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "TUI dashboard for grok-build — config-driven widget layout engine"

[[bin]]
name = "grok-build-tui"
path = "src/main.rs"

[dependencies]
xai-grok-build-config = { path = "../xai-grok-build-config" }
xai-grok-api-client = { path = "../xai-grok-api-client" }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }

[lints]
workspace = true
