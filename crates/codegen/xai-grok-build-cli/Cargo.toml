[package]
name = "xai-grok-build-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CLI for grok-build — init, auth, config, usage, api-test, tui launch"

[[bin]]
name = "grok-build"
path = "src/main.rs"

[dependencies]
xai-grok-build-config = { path = "../xai-grok-build-config" }
xai-grok-api-client = { path = "../xai-grok-api-client" }
clap = { workspace = true, features = ["derive", "env"] }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
dirs = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
