[package]
license = "Apache-2.0"
name = "xai-grok-audit"
version = "0.1.0"
edition.workspace = true
description = "Tamper-evident audit trail engine for Grok Build agent actions — append-only SQLite journal with BLAKE3 cryptographic chaining"

[dependencies]
anyhow = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
dirs = { workspace = true }
regex = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
xai-sqlite-journal = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true
